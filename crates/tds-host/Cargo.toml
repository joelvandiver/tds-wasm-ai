[package]
name = "tds-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wasmtime-based sandbox host that runs an AI agent with mediated capabilities."

[lib]
name = "tds_host"
path = "src/lib.rs"

[[bin]]
name = "tds-host"
path = "src/main.rs"

[dependencies]
tds-abi = { path = "../tds-abi" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

wasmtime = { version = "38", default-features = false, features = ["cranelift", "runtime", "std", "parallel-compilation"] }

reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls-native-roots",
] }

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }

[dev-dependencies]
tempfile = "3"
wat = "1"
