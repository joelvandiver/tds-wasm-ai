[workspace]
resolver = "2"
members = ["crates/tds-abi", "crates/tds-host"]
# The guest agent is built for wasm32-unknown-unknown with its own workspace.
exclude = ["crates/tds-agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/joelvandiver/tds-wasm-ai"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
