# Offline policy: no API key, no network, deterministic model.
#
# The mock provider drives the agent loop from directives in the task text —
# a line like `!tool now {}` becomes a tool call — so the sandbox, the ABI, and
# the tool surface can all be exercised end to end with nothing external.

[limits]
fuel = 200_000_000
wall_clock_ms = 15_000
memory_bytes = 33_554_432      # 32 MiB
table_elements = 4_096
max_steps = 4
max_request_bytes = 1_048_576  # 1 MiB

[llm]
provider = "mock"
model = "claude-opus-5"
max_tokens = 2048
effort = "low"
thinking = "adaptive"
summarize_thinking = false
base_url = "https://api.anthropic.com"
api_version = "2023-06-01"
api_key_env = "ANTHROPIC_API_KEY"
request_timeout_ms = 30_000
max_retries = 0
server_side_fallback = true

[tools]
enabled = ["now", "kv_get", "kv_put"]

[tools.http]
allowed_hosts = []
max_response_bytes = 65_536
timeout_ms = 15_000

[tools.kv]
max_keys = 32
max_value_bytes = 4_096
